<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirWatch Review</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
 integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
 integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
:root{--bg:#0f1216;--card:#171b21;--line:#262c35;--fg:#e3e7ec;--mute:#8b95a3;--acc:#5aa9ff;
--hit:#3fb950;--miss:#f85149;--false:#d29922;--none:#6e7681;--high:#f85149;--low:#d29922;--echo:#5aa9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:1000;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
h1{font-size:17px;margin:0 0 8px}nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;font:inherit}
nav button.on{background:var(--acc);border-color:var(--acc);color:#000;font-weight:600}
main{padding:14px 16px;max-width:1200px;margin:0 auto}section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 12px}
.msg{color:var(--mute);margin:4px 0 10px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500;font-size:12px}tr.click{cursor:pointer}tr.click:hover{background:#1d232b}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600;color:#000}
.k-hit{background:var(--hit)}.k-miss{background:var(--miss)}.k-false{background:var(--false)}.k-none,.k-unknown{background:var(--none)}
.t-HIGH{color:var(--high)}.t-LOW{color:var(--low)}.t-ECHO,.t-QUIET{color:var(--echo)}.t-IGNORED_FLEET{color:var(--mute)}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-size:22px}.stat span{color:var(--mute);font-size:12px}
input[type=search],select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;width:100%;max-width:420px}
.btn{background:var(--acc);color:#000;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.detail td{background:#12161b}.hint{color:var(--hit);font-weight:600}.home{color:var(--mute)}
#map{height:72vh;border-radius:10px;border:1px solid var(--line)}
.legend span{margin-right:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.scroll{overflow-x:auto}a{color:var(--acc)}
th.s{cursor:pointer;user-select:none}th.s:after{content:" ↕";opacity:.35}th.s.asc:after{content:" ↑";opacity:1}th.s.desc:after{content:" ↓";opacity:1}
svg.tl{display:block}svg.tl .ax{stroke:var(--line)}svg.tl text{fill:var(--mute);font-size:10px}
</style>
</head>
<body>
<header>
<h1>AirWatch Review</h1>
<nav id="nav"></nav>
</header>
<main>
<section id="overview"></section>
<section id="marks"></section>
<section id="police"></section>
<section id="finder"></section>
<section id="journal"></section>
<section id="repeat"></section>
<section id="fixed"></section>
<section id="map-tab"><div class="card"><div class="legend" id="legend"></div></div><div id="map"></div></section>
<section id="export"></section>
</main>
<script>
const TABS=[["overview","Overview"],["marks","Marks"],["police","Police sightings"],["finder","Signature finder"],["journal","Alert journal"],
["repeat","Repeat offenders"],["fixed","Fixed routers"],["map-tab","Map"],["export","Export for Claude"]];
const KIND={hit:"Confirmed",miss:"Missed",false:"False alarm",none:"Nothing there",unknown:"?"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const get=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(u+": "+r.status);return r.json()};
const when=t=>t?new Date(t).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"no GPS time";
const kindTag=k=>`<span class="tag k-${k}">${KIND[k]||k}</span>`;
const tier=t=>`<span class="t-${esc(t)}">${esc(t==="ECHO"?"MINOR":t==="LOW"?"MAYBE":t==="HIGH"?"POLICE":t)}</span>`;
const mapLink=(la,lo)=>la!=null?`<a target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${la}&mlon=${lo}#map=18/${la}/${lo}">map</a>`:"";
const loaded={};
const clock=t=>t?new Date(t).toLocaleTimeString([], {hour:"numeric",minute:"2-digit",second:"2-digit"}):"";
// Click a column header to sort (numbers numerically, everything else as text).
document.addEventListener("click",e=>{const th=e.target.closest("th.s");if(!th)return;const tb=th.closest("table").tBodies[0];
  const i=[...th.parentNode.children].indexOf(th),asc=!th.classList.contains("asc");
  th.parentNode.querySelectorAll("th").forEach(x=>x.classList.remove("asc","desc"));th.classList.add(asc?"asc":"desc");
  const key=r=>{const c=r.children[i];const v=c?(c.dataset.v??c.textContent.trim()):"";const n=parseFloat(v);return v!==""&&!isNaN(n)&&/^-?[\d.]/.test(v)?n:v.toLowerCase()};
  [...tb.rows].filter(r=>r.classList.contains("detail")).forEach(r=>r.remove());   // close expanded rows first
  [...tb.rows].sort((a,b)=>{const x=key(a),y=key(b);return (x>y?1:x<y?-1:0)*(asc?1:-1)}).forEach(r=>tb.append(r))});
// Signal over time: strongest signal each second (gaps = not heard). Taller = stronger.
function spark(tl,w=140,h=28,axes=false){if(!tl||!tl.length)return"";const lo=-100,hi=-30,n=Math.max(tl.length-1,1),pad=axes?24:2;
  const X=i=>pad+(w-pad-2)*i/n,Y=v=>h-(axes?14:2)-(h-(axes?18:4))*(Math.min(hi,Math.max(lo,v))-lo)/(hi-lo);
  let d="",pen=false;tl.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1);pen=true});
  const dots=tl.map((v,i)=>v==null?"":`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${axes?2:1.2}" fill="var(--acc)"/>`).join("");
  const ax=axes?`<line class="ax" x1="${pad}" x2="${w}" y1="${Y(-60)}" y2="${Y(-60)}"/><line class="ax" x1="${pad}" x2="${w}" y1="${Y(-90)}" y2="${Y(-90)}"/>
   <text x="0" y="${Y(-60)+3}">-60</text><text x="0" y="${Y(-90)+3}">-90</text><text x="${pad}" y="${h-2}">0 s</text><text x="${w-30}" y="${h-2}">${tl.length-1} s</text>`:"";
  return `<svg class="tl" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${ax}<path d="${d}" fill="none" stroke="var(--acc)" stroke-width="1.5"/>${dots}</svg>`}

function show(id){
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===id));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===id));
  location.hash=id; if(!loaded[id]){loaded[id]=true;(LOADERS[id]||(()=>{}))().catch(e=>{$("#"+id).innerHTML=`<p class="msg">${esc(e.message)}</p>`})}
  if(id==="map-tab"&&window._map)setTimeout(()=>_map.invalidateSize(),50);
}
$("#nav").innerHTML=TABS.map(([id,l])=>`<button data-t="${id}">${l}</button>`).join("");
$("#nav").onclick=e=>{if(e.target.dataset.t)show(e.target.dataset.t)};

const LOADERS={
async overview(){
  const [s,dr]=await Promise.all([get("api/summary"),get("api/drops")]),k=s.by_kind||{};
  $("#overview").innerHTML=`<div class="stats">
   <div class="stat"><b>${s.drives}</b><span>drives</span></div>
   <div class="stat"><b>${s.marks}</b><span>marks</span></div>
   <div class="stat"><b style="color:var(--hit)">${k.hit||0}</b><span>confirmed</span></div>
   <div class="stat"><b style="color:var(--miss)">${k.miss||0}</b><span>missed</span></div>
   <div class="stat"><b style="color:var(--false)">${k.false||0}</b><span>false alarms</span></div>
   <div class="stat"><b>${s.alerts}</b><span>journal alerts</span></div>
   <div class="stat"><b>${s.samples||0}</b><span>background samples</span></div></div>
   <div class="card" style="margin-top:12px"><p class="msg">Everything here is built from the uploads the board sends on arrival
   (${s.files} files so far${s.vendors_loaded?"":"; vendor names are still downloading"}).
   <b>Police sightings</b> ranks what was heard where you saw police; <b>Fixed routers</b> lists things that alert in the same spot
   every time; <b>Export for Claude</b> makes one file to drop into a chat. Raw uploads: <a href="files">files</a>.</p></div>
   <div class="card"><b>Dropped frames</b><p class="msg">The board's queues overflowed. <b>Target</b> drops are frames from matching devices
   (they can delay or miss an alert); <b>background</b> drops only thin out marks and samples. Counts are per drive, from power-on.
   If target drops show up regularly, tell Claude: the queue sizes can be raised.</p>
   ${dr.length?`<table><thead><tr><th>Drive</th><th>Target Wi-Fi</th><th>Target Bluetooth</th><th>Background</th></tr></thead><tbody>
   ${dr.map(d=>`<tr><td>${d.drive}</td><td class="${d.drops?"t-HIGH":""}">${d.drops}</td><td class="${d.ble_drops?"t-HIGH":""}">${d.ble_drops}</td><td>${d.obs_dropped}</td></tr>`).join("")}</tbody></table>`
   :'<p class="msg">None recorded. (Target drops are logged from this firmware version on.)</p>'}</div>`;
},
async marks(){
  const ms=await get("api/marks");
  const el=$("#marks");
  el.innerHTML=`<input type="search" id="mq" placeholder="Filter (drive, MAC, name, kind…)"><p class="msg">${ms.length} marks, newest first. Click one to see everything heard.</p>
  <div class="scroll"><table><thead><tr><th>Mark</th><th>When</th><th>Kind</th><th>Alerting</th><th>Speed</th><th></th></tr></thead><tbody id="mt"></tbody></table></div>`;
  const draw=()=>{const q=$("#mq").value.toLowerCase();$("#mt").innerHTML=ms.filter(m=>!q||JSON.stringify(m).toLowerCase().includes(q)).map(m=>
   `<tr class="click" data-id="${m.id}"><td>Drive ${m.drive} · ${m.mark}${m.followup_of?" (follow-up)":""}</td><td>${when(m.time)}</td><td>${kindTag(m.kind)}</td>
    <td>${m.alert_lines.length?m.alert_lines.map(a=>`${tier(a.tier)} ${esc(a.label||"")}${a.ssid?` "${esc(a.ssid)}"`:""}`).join("<br>"):'<span class="msg">nothing</span>'}</td>
    <td>${m.mph!=null?Math.round(m.mph)+" mph":""}</td><td>${mapLink(m.lat,m.lon)}</td></tr>`).join("")};
  $("#mq").oninput=draw;draw();
  $("#mt").onclick=async e=>{const tr=e.target.closest("tr.click");if(!tr||e.target.tagName==="A")return;
    const next=tr.nextElementSibling;if(next&&next.classList.contains("detail")){next.remove();return}
    const m=await get("api/mark?id="+tr.dataset.id);const d=document.createElement("tr");d.className="detail";
    d.innerHTML=`<td colspan="6">${markDetail(m)}</td>`;tr.after(d)};
},
async police(){
  const p=await get("api/police");
  $("#police").innerHTML=`<p class="msg">Every mark where you saw police. Under each, what was heard there ranked by how interesting it is:
   heard rarely anywhere else, strong (close), a police-type vendor (<span class="hint">green</span>), and not home internet gear.
   This is the comparison to use when the board missed a cruiser.</p>`+(p.sightings.length?p.sightings.map(s=>`<div class="card">
   <b>Drive ${s.drive} · mark ${s.mark}</b> ${kindTag(s.kind)} <span class="msg">${when(s.time)} · ${s.mph!=null?Math.round(s.mph)+" mph":""}
   ${s.lead?" · alerting on "+esc(s.lead):""}</span> ${mapLink(s.lat,s.lon)}
   <div class="scroll"><table><thead><tr><th>Score</th><th>Transmitter</th><th>Vendor</th><th>Name</th><th>Signal</th><th>Other marks</th></tr></thead><tbody>
   ${s.candidates.map(c=>`<tr><td>${c.score}</td><td class="mono">${esc(c.kind)} ${esc(c.mac)}${c.alerted?` <span class="t-LOW">alerted</span>`:""}</td>
     <td class="${c.hint?"hint":""}">${esc(c.vendor)}</td><td>${esc(c.ssid||c.name||"")}</td><td>${c.rssi??""}</td>
     <td>${c.other_marks}${c.nothing_marks?` (${c.nothing_marks} "nothing")`:""}</td></tr>`).join("")}</tbody></table></div></div>`).join(""):'<p class="msg">No police marks yet.</p>');
},
async finder(){
  const f=await get("api/finder");
  const types=[...new Set(f.candidates.map(c=>c.type))].sort();
  $("#finder").innerHTML=`<p class="msg">Every detail the board logged about each device (network names, names it searched for, vendor, codes in its
   beacons, WPS model, Bluetooth company / services / name), counted where you saw police
   (${f.police_snapshots} sightings) versus everywhere else (${f.baseline_snapshots} other marks and background samples).
   Top of the list = heard at police sightings in several places and rarely otherwise: a candidate signature.
   "Already caught" = it already makes the board alert. Copy the suggested line and send it to Claude (or edit the firmware) to add it, at MAYBE first.</p>
   <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px"><input type="search" id="fq" placeholder="Filter…" style="max-width:300px">
   <select id="ft" style="max-width:220px"><option value="">All kinds</option>${types.map(t=>`<option>${esc(t)}</option>`).join("")}</select>
   <label class="msg"><input type="checkbox" id="fn"> hide already caught</label><label class="msg"><input type="checkbox" id="fm"> only 2+ places</label></div>
   <div class="scroll"><table><thead><tr><th class="s">Score</th><th class="s">Kind</th><th class="s">Value</th><th class="s">Police places</th><th class="s">Police drives</th>
   <th class="s">Elsewhere</th><th class="s">Lift</th><th class="s">Devices</th><th>Suggested signature</th></tr></thead><tbody id="fb"></tbody></table></div>`;
  const draw=()=>{const q=$("#fq").value.toLowerCase(),t=$("#ft").value,hc=$("#fn").checked,mp=$("#fm").checked;
   const rows=f.candidates.filter(c=>(!t||c.type===t)&&(!hc||!c.caught)&&(!mp||c.places>1)&&(!q||JSON.stringify(c).toLowerCase().includes(q)));
   $("#fb").innerHTML=rows.map(c=>`<tr><td>${c.score}</td><td>${esc(c.type)}</td><td><b>${esc(c.value)}</b>${c.label?`<div class="msg">${esc(c.label)}</div>`:""}
    ${c.caught?'<div class="t-LOW">already caught</div>':""}<div class="msg mono">${c.examples.map(x=>`${esc(x.mac)} ${x.rssi??""} (D${x.drive}·${x.mark})`).join("<br>")}</div></td>
    <td>${c.places}</td><td data-v="${c.drives.length}">${c.drives.join(", ")}</td><td data-v="${c.base_hits}">${c.base_hits} of ${f.baseline_snapshots}</td><td>${c.lift}</td><td>${c.devices}</td>
    <td><code>${esc(c.suggest)}</code> <button class="b" data-copy="${esc(c.suggest)}" style="padding:2px 8px;font-size:12px;cursor:pointer">copy</button></td></tr>`).join("")
    ||'<tr><td colspan="9" class="msg">Nothing yet: needs marks where you saw police.</td></tr>'};
  ["fq","ft","fn","fm"].forEach(id=>$("#"+id).oninput=draw);draw();
  $("#fb").onclick=e=>{const b=e.target.closest("[data-copy]");if(!b)return;navigator.clipboard?.writeText(b.dataset.copy).then(()=>{b.textContent="copied";setTimeout(()=>b.textContent="copy",1200)})};
},
async journal(){
  const j=await get("api/journal");
  $("#journal").innerHTML=`<div class="card"><b>Most frequent</b><p class="msg">Alerted on more than one drive.</p><div class="scroll"><table>
   <thead><tr><th>Device</th><th>Vendor</th><th>Alerts</th><th>Drives</th><th>Best</th><th>Last</th></tr></thead><tbody>
   ${j.frequent.map(f=>`<tr><td>${esc(f.label||"")} ${f.ssid?`"${esc(f.ssid)}"`:""}<div class="mono msg">${esc(f.mac)}</div></td><td>${esc(f.vendor)}</td>
   <td>${f.alerts}</td><td>${f.drives}</td><td>${f.best??""}</td><td>${when(f.last)}</td></tr>`).join("")||'<tr><td colspan="6" class="msg">Nothing yet.</td></tr>'}</tbody></table></div></div>
   <input type="search" id="jq" placeholder="Filter (name, MAC, tier…)"><p class="msg">Click a column to sort, or a row to see its signal over time.</p><div class="scroll"><table><thead><tr>
   <th class="s">Started</th><th class="s">Ended</th><th class="s">What</th><th class="s">Best signal</th><th>Signal over time</th><th class="s">Lasted</th><th class="s">Speed</th><th></th></tr></thead><tbody id="jt"></tbody></table></div>`;
  const idx=j.alerts.map((a,i)=>[a,i,JSON.stringify(a).toLowerCase()]);   // index + search text, once
  const draw=()=>{const q=$("#jq").value.toLowerCase();$("#jt").innerHTML=idx.filter(([a,i,t])=>!q||t.includes(q)).map(([a,i])=>
   `<tr class="click" data-i="${i}"><td data-v="${esc(a.time||"")}">${when(a.time)}<div class="msg">drive ${a.drive}</div></td><td data-v="${esc(a.end||"")}">${clock(a.end)}</td>
    <td>${tier(a.tier)} ${esc(a.label||"")} ${a.ssid?`"${esc(a.ssid)}"`:""}
    <div class="mono msg">${esc(a.src)} ${esc(a.mac)} · ${esc(a.vendor)}${a.ongoing?" · cut short":""}${a.ended?" · ended: "+esc(a.ended):""}</div></td>
    <td>${a.best??""}</td><td>${spark(a.tl)||'<span class="msg">—</span>'}</td><td data-v="${a.dur??""}">${a.dur!=null?a.dur+" s":""}</td><td>${a.mph!=null?Math.round(a.mph)+" mph":""}</td><td>${mapLink(a.lat,a.lon)}</td></tr>`).join("")};
  $("#jt").onclick=e=>{const tr=e.target.closest("tr.click");if(!tr||e.target.tagName==="A")return;const nx=tr.nextElementSibling;
    if(nx&&nx.classList.contains("detail")){nx.remove();return}const a=j.alerts[+tr.dataset.i];const d=document.createElement("tr");d.className="detail";
    d.innerHTML=`<td colspan="8">${a.tl?spark(a.tl,620,150,true)+`<p class="msg">Strongest signal in each second from ${clock(a.time)}. A single rise and fall = something you drove past;
     a long flat line = something moving with you; a short sharp spike = something passing the other way.</p>`:'<p class="msg">No signal timeline (logged before the board recorded them).</p>'}
     ${a.from_lat!=null?`<p class="msg">First heard ${mapLink(a.from_lat,a.from_lon)}, strongest ${mapLink(a.lat,a.lon)}, last heard ${mapLink(a.to_lat,a.to_lon)}.</p>`:""}</td>`;tr.after(d)};
  $("#jq").oninput=draw;draw();
},
async repeat(){
  const r=await get("api/repeat");
  $("#repeat").innerHTML=`<div class="card"><b>Alerted in more than one mark</b><p class="msg">And what you said was there each time.</p><div class="scroll"><table>
   <thead><tr><th>Device</th><th>Vendor</th><th>Marks</th></tr></thead><tbody>
   ${r.alerting.map(e=>`<tr><td>${esc(e.label||"")} ${e.ssid?`"${esc(e.ssid)}"`:""}<div class="mono msg">${esc(e.mac)}</div></td><td>${esc(e.vendor)}</td>
    <td>${e.marks.map(m=>`D${m.drive}·${m.mark} ${kindTag(m.kind)}`).join(" ")}</td></tr>`).join("")||'<tr><td colspan="3" class="msg">Nothing yet.</td></tr>'}</tbody></table></div></div>
   <div class="card"><b>Heard at police sightings in different places</b><p class="msg">Any transmitter, alerting or not, heard where you saw police in two or more places at least 500 m apart, on two or more drives
   (${r.police_drive_count} drives with police so far). Ones also heard on other drives are usually just along your route.</p><div class="scroll"><table>
   <thead><tr><th>Transmitter</th><th>Vendor</th><th>Places</th><th>Police drives</th><th>Other drives</th><th>Best</th></tr></thead><tbody>
   ${r.sightings.map(e=>`<tr><td class="mono">${esc(e.mac)}<div>${esc(e.ssid||"")}</div></td><td>${esc(e.vendor)}</td><td>${e.places}</td>
    <td>${e.police_drives.join(", ")}</td><td>${e.other_drives.join(", ")||"none"}</td><td>${e.best}</td></tr>`).join("")||'<tr><td colspan="6" class="msg">Needs police sightings in at least two places, on two drives.</td></tr>'}</tbody></table></div></div>`;
},
async fixed(){
  const f=await get("api/fixed");
  $("#fixed").innerHTML=`<p class="msg">Things that alerted and were heard at the same spot (within 300 m) on different drives: most likely a router on a building,
   not a vehicle. For you to review; nothing is silenced automatically. To silence one, copy its line into <code>quietMacTargets</code> in the firmware
   (or send it to Claude): it stays in the logs, just without the beep.</p><div class="scroll"><table>
   <thead><tr><th>Device</th><th>Vendor</th><th>Drives</th><th>Spread</th><th></th><th></th><th>Quiet-list line</th></tr></thead><tbody id="fxb">
   ${f.map(e=>`<tr><td>${tier(e.tier)} ${esc(e.label||"")} ${e.ssid?`"${esc(e.ssid)}"`:""}<div class="mono msg">${esc(e.mac)}</div></td><td>${esc(e.vendor)}</td>
    <td>${e.drives.length} (${e.drives.join(", ")})</td><td>${e.spread_m} m</td><td>${e.stationary?'<b>stationary</b>':'<span class="msg">moves</span>'}</td><td>${mapLink(e.lat,e.lon)}</td>
    <td>${e.stationary?`<button class="b" data-copy="${esc(e.quiet)}" style="padding:2px 8px;font-size:12px;cursor:pointer">copy</button>`:""}</td></tr>`).join("")||'<tr><td colspan="7" class="msg">Nothing has alerted in the same place on two drives yet.</td></tr>'}</tbody></table></div>`;
  $("#fxb").onclick=e=>{const b=e.target.closest("[data-copy]");if(!b)return;navigator.clipboard?.writeText(b.dataset.copy).then(()=>{b.textContent="copied";setTimeout(()=>b.textContent="copy",1200)})};
},
async "map-tab"(){
  const d=await get("api/map");
  const map=window._map=L.map("map");
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);
  const col={hit:"#3fb950",miss:"#f85149",false:"#d29922",none:"#6e7681",unknown:"#6e7681"},tcol={HIGH:"#f85149",LOW:"#d29922",ECHO:"#5aa9ff",QUIET:"#5aa9ff"};
  const pts=[];
  const ml=L.layerGroup(d.marks.map(m=>{pts.push([m.lat,m.lon]);return L.circleMarker([m.lat,m.lon],{radius:8,color:"#000",weight:1,fillColor:col[m.kind],fillOpacity:.95})
    .bindPopup(`<b>Drive ${m.drive} · mark ${m.mark}</b><br>${KIND[m.kind]}<br>${when(m.time)}${m.lead?"<br>"+esc(m.lead):""}`)})).addTo(map);
  const al=L.layerGroup(d.alerts.flatMap(a=>{pts.push([a.lat,a.lon]);const out=[L.circleMarker([a.lat,a.lon],{radius:5,color:tcol[a.tier]||"#999",weight:2,fillOpacity:.3})
    .bindPopup(`${esc(a.tier)} ${esc(a.label||"")}${a.ssid?` "${esc(a.ssid)}"`:""}<br>${esc(a.mac)} · best ${a.best}<br>drive ${a.drive}, ${when(a.time)}`)];
    // where it was first heard -> strongest -> last heard
    if(a.from_lat!=null&&a.to_lat!=null)out.push(L.polyline([[a.from_lat,a.from_lon],[a.lat,a.lon],[a.to_lat,a.to_lon]],{color:tcol[a.tier]||"#999",weight:2,opacity:.7,dashArray:"4 4"}));
    return out})).addTo(map);
  const fl=L.layerGroup(d.fixed.map(f=>L.circle([f.lat,f.lon],{radius:Math.max(40,f.spread_m),color:"#a371f7",weight:2,fillOpacity:.1})
    .bindPopup(`Fixed: ${esc(f.label||"")} ${f.ssid?`"${esc(f.ssid)}"`:""}<br>${esc(f.mac)}<br>drives ${f.drives.join(", ")}`))).addTo(map);
  L.control.layers(null,{"Marks":ml,"Alerts (peak signal)":al,"Fixed routers":fl}).addTo(map);
  if(pts.length)map.fitBounds(pts,{padding:[30,30],maxZoom:15});else map.setView([37.6,-77.5],11);
  $("#legend").innerHTML=Object.entries({hit:"confirmed",miss:"missed",false:"false alarm",none:"nothing there"}).map(([k,l])=>`<span><i class="dot" style="background:${col[k]}"></i>${l}</span>`).join("")+
   `<span><i class="dot" style="border:2px solid #d29922"></i>alert, where strongest (dashed: first → last heard)</span><span><i class="dot" style="border:2px solid #a371f7"></i>fixed router</span>`;
},
async export(){
  const ds=await get("api/drives");
  $("#export").innerHTML=`<p class="msg">Pick drives and download one text file with their marks and alerts, vendor names filled in, ready to drop into a chat with Claude.
   It contains GPS positions, so share it only where you mean to.</p>
   <div class="card"><label><input type="checkbox" id="xall"> all</label><div id="xl" style="columns:3 160px;margin-top:8px">
   ${ds.map(d=>`<label style="display:block"><input type="checkbox" value="${d.drive}"> Drive ${d.drive} <span class="msg">${when(d.first)} · ${d.marks||0} marks, ${d.alerts||0} alerts</span></label>`).join("")||'<span class="msg">No drives yet.</span>'}
   </div></div><a class="btn" id="xgo" href="#">Download export</a>`;
  $("#xall").onchange=e=>document.querySelectorAll("#xl input").forEach(i=>i.checked=e.target.checked);
  $("#xgo").onclick=e=>{const v=[...document.querySelectorAll("#xl input:checked")].map(i=>i.value);if(!v.length){e.preventDefault();alert("Pick at least one drive.");return}
    e.target.href="export?drives="+v.join(",")};
}};

function markDetail(m){
  const al=m.lines.filter(l=>l.kind==="ALERT"||l.kind==="EARLIER"),hd=m.lines.filter(l=>l.kind==="WIFI"||l.kind==="BLE");
  const rel=(at,ms)=>at?`<td data-v="${esc(at)}">${clock(at)}</td>`:`<td data-v="${-(ms??0)}">${ms!=null?Math.round(ms/1000)+" s before":""}</td>`;
  return `${al.length?`<b>Alerting</b><table>${al.map(l=>`<tr><td>${esc(l.kind)}</td><td>${tier(l.tier)} ${esc(l.label||"")} ${l.ssid?`"${esc(l.ssid)}"`:""}</td>
   <td class="mono">${esc(l.mac)}</td><td>${esc(l.vendor)}</td><td>best ${l.best??l.rssi}</td><td>${spark(l.tl,260,70,true)}</td><td>${mapLink(l.at_lat,l.at_lon)}</td></tr>`).join("")}</table>`:""}
   <b>Heard in the 30 s before (${hd.length})</b> <span class="msg">Click a column to sort. "Elsewhere" = how many other marks it was heard in.</span>
   <div class="scroll"><table><thead><tr><th class="s">Radio</th><th class="s">Address</th><th class="s">Vendor</th><th class="s">Name</th><th class="s">Signal</th>
   <th class="s">First heard</th><th class="s">Last heard</th><th class="s">Seconds heard</th><th class="s">Elsewhere</th><th class="s">Talking to</th></tr></thead><tbody>
   ${hd.map(l=>`<tr><td>${esc(l.kind)}</td><td class="mono">${esc(l.mac)}${l.alerted?` <span class="t-LOW">${esc(l.alerted)}</span>`:""}</td><td>${esc(l.vendor)}</td>
    <td>${esc(l.ssid||l.name||"")}${l.wps?`<div class="msg">WPS: ${esc(l.wps)}</div>`:""}</td><td>${l.rssi??""}</td>${rel(l.first_at,l.first_ms)}${rel(l.last_at,l.ago_ms)}
    <td>${l.secs??""}</td><td>${l.elsewhere}</td><td class="mono">${esc(l.peer||"")}</td></tr>`).join("")}</tbody></table></div>`;
}
show(TABS.some(t=>t[0]===location.hash.slice(1))?location.hash.slice(1):"overview");
</script>
